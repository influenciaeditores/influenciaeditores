<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta</title>
  <!-- Fuentes tipográficas de alta calidad desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Hoja de estilos CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/registro.css">
  <link rel="stylesheet" href="css/footer.css">
</head>
<body>

  <header class="register-header">
       <a href="index.html" class="logo-enlace">
       <img src="logo.png" alt="Logo Influenciaeditores" class="register-logo">
        <span class="texto-logo">Influenciaeditores</span>
        </a>
    </header>

  <div class="register-container">
    <main class="form-card">
      <h1>Crear una cuenta</h1>
      <p class="subtitle">Ingresa tus datos para registrarte</p>

      <form action="#" method="POST" class="register-form" id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullname">Nombre completo *</label>
          <input type="text" id="fullname" name="fullname" placeholder="Ej. Antonin Artaud" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico *</label>
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="document_id">Cédula, DNI o Documento de Identidad *</label>
          <input type="text" id="document_id" name="document_id" placeholder="Ej. 1098765432" required>
        </div>

        <div class="form-group">
          <label for="country">País *</label>
          <select id="country" name="country" required>
            <option value="" disabled selected>Selecciona tu país</option>
            <option value="CO">Colombia</option>
            <option value="AR">Argentina</option>
            <option value="CL">Chile</option>
            <option value="ES">España</option>
            <option value="MX">México</option>
            <option value="PE">Perú</option>
            <option value="OTRO">Otro país</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone">Teléfono <span class="optional">(Opcional)</span></label>
          <input type="tel" id="phone" name="phone" placeholder="+57 300 000 0000">
        </div>

        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirmar contraseña *</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" required>
          <span class="error-message" id="passwordError">Las contraseñas no coinciden.</span>
        </div>

        <div class="form-terms">
          <input type="checkbox" id="terms" required>
          <label for="terms">Acepto los <a href="#">términos y condiciones</a></label>
        </div>

        <button type="submit" class="btn-submit">Registrarse</button>
      </form>

      <footer class="form-footer">
        <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
      </footer>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
