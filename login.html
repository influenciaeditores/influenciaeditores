<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/footer.css">
</head>
<body>

 <!-- Encabezado Simplificado  -->
  <header class="main-header">
    <a href="index.html" class="logo-enlace">
      <img src="logo.png" alt="Logo Influenciaeditores" class="imagen-logo">
      <span class="texto-logo">Influenciaeditores</span>
    </a>
    
  </header>

  <main class="login-container">
    <div class="login-card">
      <h2>Iniciar Sesión</h2>
      <p class="login-subtitle">Accede a tu biblioteca digital</p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Ingresar</button>
      </form>

      <div class="login-footer">
        <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
      </div>
    </div>
  </main>

  <!-- Tu Footer existente -->
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
